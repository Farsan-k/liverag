services:
  postgres:
    image: postgres:16
    container_name: liverag-postgres
    environment:
      POSTGRES_DB: liverag
      POSTGRES_USER: liverag
      POSTGRES_PASSWORD: liverag_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: